<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
    Giallo Booleano 
 </header>  
 <main>
    <div class="container"></div>
    <section class="recipe">
        <h4 class="recipe-category">Categoria: Dolci e Dessert</h4>
        <h3 class="recipe-title">Tiramisu</h3>
        <div class="recipe-rate" data-rate="4.5">
            <span class="recipe-rate-value">4.5</span>
            <span class="recipe-rate-stars">★★★★★</span>
        </div>
        <div class="dieta">
            <div class="top-dieta">
              <div class="calories">
                  <span class="badge">544 Kcal</span>
                </div>
              <div class="quick-notes">
              <ul>
                <li class="blender">Difficoltà: <strong>Facile</strong></li>
                <li class="clock">Tempo: <strong>40 min</strong></li>
                <li class="pie">Porzione per: <strong>8 persone</strong></li>
                <li class="cost">Costo: <strong>contenuto</strong></li>
                <li class="pin"><strong>Note</strong>: +2 ore di riposo in frigo</li>
              </ul>
            </div>  
        </div>
        <div class="social-icons">
 
  <a href="https://facebook.com" target="_blank">
    <i class="fa-brands fa-facebook"></i>
  </a>

        




</body>
</html>
